<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>farthing recut</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..700,0..100,0..1;1,9..144,400..600,0..100,0..1&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet">
<link rel="stylesheet" href="fig.css">
<style>
  .head { display: flex; gap: 32px; align-items: flex-end; }
  .head > div:first-child { flex: 1; }
  .atlas { flex: none; display: flex; gap: 14px; align-items: flex-end; }
  .atlas canvas { display: block; border-radius: 8px; }
  .cap { width: 190px; font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--faint); line-height: 1.5; text-align: right; }
  .cap b { color: var(--muted); font-weight: 500; }
  .grid { display: grid; grid-template-columns: 112px repeat(5, 1fr); column-gap: 14px; row-gap: 14px; margin-top: 26px; }
  .col { font-family: "JetBrains Mono", monospace; font-size: 13px; color: var(--muted); text-align: center; line-height: 1.5; }
  .col b { display: block; font-family: Fraunces, serif; font-weight: 600; font-size: 24px; color: var(--ink); font-variation-settings: "opsz" 96; }
  .col.us b { color: var(--accent); }
  .row { align-self: center; font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--muted); line-height: 1.5; }
  .row b { display: block; color: var(--ink); font-weight: 500; font-size: 13px; }
  canvas.p { display: block; border-radius: 8px; }
  .key { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
</style>
</head>
<body>
<div class="head">
  <div>
    <h1>One atlas, <em>every level.</em></h1>
    <p class="sub" id="sub" style="max-width: none"></p>
  </div>
  <div class="atlas"><div class="cap" id="atlascap"></div><div id="atlas"></div></div>
</div>
<div class="grid" id="grid"></div>
<div class="foot" id="foot"></div>
<script type="module">
import { theme, stats, img, canvas, int, pct, ready } from "./sheet.js";
const r = stats.recut;
const [pw, ph] = r.panel;
const W = (1280 - 96 - 112 - 5 * 14) / 5;
const H = (W * ph) / pw;
const grid = document.getElementById("grid");
const names = ["original", "LOD0", "LOD1", "LOD2", "LOD3"];
grid.insertAdjacentHTML("beforeend", "<div></div>");
for (const [l, info] of r.levels.entries()) {
  const tris = `${int(info.triangles)} tris`;
  const err = l < 2 ? (l === 0 ? "the source" : "every triangle") : `${pct(info.relative_error)} off`;
  grid.insertAdjacentHTML("beforeend", `<div class="col${l ? " us" : ""}"><b>${names[l]}</b>${tris}<br>${err}</div>`);
}
// Each panel: shaded on the left, the overlay on the right of the center line.
async function split(l, overlay) {
  const [plain, over] = await Promise.all([img(`out/recut_${l}.png`), img(`out/recut_${l}_${overlay}_${theme}.png`)]);
  const [c, g] = canvas(W, H);
  const half = Math.round(plain.width / 2);
  const s = c.width / plain.width;
  g.drawImage(plain, 0, 0, half, plain.height, 0, 0, half * s, c.height);
  g.drawImage(over, half, 0, plain.width - half, plain.height, half * s, 0, c.width - half * s, c.height);
  return c;
}
const rows = [
  ["seams", "UV seams", `<span class="key" style="background:${theme === "dark" ? "#ffa94d" : "#e8590c"}"></span>right half`],
  ["wire", "triangles", `<span class="key" style="background:${theme === "dark" ? "#8fbcff" : "#1453c4"}"></span>right half`],
];
for (const [overlay, name, key] of rows) {
  grid.insertAdjacentHTML("beforeend", `<div class="row"><b>${name}</b>${key}</div>`);
  for (const l of r.levels.keys()) grid.append(await split(l, overlay));
}
const atlas = await img("out/recut_atlas.png");
const [ac, ag] = canvas(136, 136);
ag.drawImage(atlas, 0, 0, ac.width, ac.height);
document.getElementById("atlas").append(ac);
document.getElementById("atlascap").innerHTML =
  `<b>LOD0–LOD3 all draw with this</b> ${r.atlas.width}² base color atlas (and its normal and ORM twins), in place of the source's ${stats.materials} materials.`;
document.getElementById("sub").innerHTML =
  `<b>Recut</b> cuts the whole model's surface afresh into charts that survive mipmapping and resamples every material into one atlas at the artist's texel density. ` +
  `LOD0 keeps every triangle; each level after it is reduced from the one before and <b>draws with the same textures</b>, so the chain costs one draw call and one texture set at any distance.`;
document.getElementById("foot").innerHTML =
  `${stats.model} (Khronos glTF sample, CC0) · ${int(stats.triangles)} triangles, ${stats.materials} materials · ` +
  `recut chain, step ${0.35} · errors are measured two-way Hausdorff distance over the bounding-box diagonal · ` +
  `drawn with the web demo's engine viewer and its editor overlays.<br>Reproduce: demo-web/readme/build.sh`;
await ready();
</script>
</body>
</html>
