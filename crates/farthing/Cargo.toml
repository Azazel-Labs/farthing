[package]
name = "farthing"
description = "Mesh LOD for real-time 3D: attribute-aware reduction, UV unwrapping and atlas packing, material baking, aggregation, voxel remeshing, impostors, visibility culling and skinning LOD."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["lod", "mesh", "simplification", "gltf", "gamedev"]
categories = ["graphics", "game-development", "rendering"]

[lints]
workspace = true

[features]
default = ["io"]
# glTF 2.0 and OBJ import/export (`farthing::io`).
io = ["dep:gltf", "dep:polysmelt", "dep:tobj", "dep:serde_json"]
# Every other model format polysmelt reads into triangle meshes, all pure Rust (they build for
# WebAssembly), through `io::load` and `io::load_model`: FBX, OBJ with its MTL, COLLADA,
# SketchUp, 3MF, AMF, 3DS, PLY, STL, OFF, DXF, X3D and VRML, VRM, MagicaVoxel, DirectX `.x`,
# LightWave, AC3D, MilkShape 3D, Blitz3D, MD2, MD3, MD5, IQM, SMD, PMX and PMD, OGRE,
# OpenFlight, OpenGEX, Irrlicht and XGL (see `MODEL_EXTENSIONS`). Textures in WebP, TGA, BMP,
# GIF, TIFF, PSD and DDS are converted to PNG. Point clouds, splats and motion-only files are
# left out: farthing reads triangles.
formats = [
    "io",
    "polysmelt/fs",
    "polysmelt/obj",
    "polysmelt/ply",
    "polysmelt/stl",
    "polysmelt/vox",
    "polysmelt/3ds",
    "polysmelt/3mf",
    "polysmelt/fbx",
    "polysmelt/dae",
    "polysmelt/skp",
    "polysmelt/x3d",
    "polysmelt/amf",
    "polysmelt/off",
    "polysmelt/dxf",
    "polysmelt/mmd",
    "polysmelt/directx",
    "polysmelt/md2",
    "polysmelt/md3",
    "polysmelt/md5",
    "polysmelt/iqm",
    "polysmelt/smd",
    "polysmelt/ms3d",
    "polysmelt/b3d",
    "polysmelt/ogre",
    "polysmelt/lwo",
    "polysmelt/ac3d",
    "polysmelt/flt",
    "polysmelt/ogex",
    "polysmelt/irr",
    "polysmelt/xgl",
    "polysmelt/webp",
    "polysmelt/tga",
    "polysmelt/bmp",
    "polysmelt/gif",
    "polysmelt/tiff",
    "polysmelt/psd",
    "polysmelt/dds",
    "image/webp",
    "image/tga",
    "image/bmp",
]
# USD as well (`.usd`, `.usda`, `.usdc`, `.usdz`).
usd = ["formats", "polysmelt/usd"]

[dependencies]
glam.workspace = true
serde.workspace = true
thiserror.workspace = true
image.workspace = true
rayon.workspace = true
thread_local.workspace = true
mikktspace.workspace = true
snugly.workspace = true
gltf = { workspace = true, optional = true }
polysmelt = { workspace = true, optional = true }
tobj = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
naga.workspace = true

[[example]]
name = "bench_assets"
required-features = ["io"]

[[example]]
name = "bench_ir"
required-features = ["io"]

[[example]]
name = "diag_target"
required-features = ["io"]

[[example]]
name = "bench_uv"
required-features = ["io"]

[[example]]
name = "bench_remesh"
required-features = ["io"]

[[example]]
name = "bench_hlod_tree"
required-features = ["io"]

[[example]]
name = "thin_features"
required-features = ["io"]
