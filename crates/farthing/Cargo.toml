[package]
name = "farthing"
description = "Mesh LOD for real-time 3D: attribute-aware reduction, UV unwrapping and atlas packing, material baking, aggregation, voxel remeshing, impostors, visibility culling and skinning LOD."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["lod", "mesh", "simplification", "gltf", "gamedev"]
categories = ["graphics", "game-development", "rendering"]

[lints]
workspace = true

[features]
default = ["io"]
# glTF 2.0 and OBJ import/export (`farthing::io`).
io = ["dep:gltf", "dep:polysmelt", "dep:tobj", "dep:serde_json"]
# The other model formats polysmelt reads, all pure Rust (they build for WebAssembly): OBJ with
# its MTL, PLY, STL, MagicaVoxel, 3DS, 3MF and FBX, through `io::load` and `io::load_model`;
# WebP, TGA and BMP textures as well.
formats = [
    "io",
    "polysmelt/fs",
    "polysmelt/obj",
    "polysmelt/ply",
    "polysmelt/stl",
    "polysmelt/vox",
    "polysmelt/3ds",
    "polysmelt/3mf",
    "polysmelt/fbx",
    "polysmelt/webp",
    "image/webp",
    "image/tga",
    "image/bmp",
]
# USD as well (`.usd`, `.usda`, `.usdc`, `.usdz`). Its reader needs Rust 1.96.
usd = ["formats", "polysmelt/usd"]

[dependencies]
glam.workspace = true
serde.workspace = true
thiserror.workspace = true
image.workspace = true
rayon.workspace = true
thread_local.workspace = true
mikktspace.workspace = true
snugly.workspace = true
gltf = { workspace = true, optional = true }
polysmelt = { workspace = true, optional = true }
tobj = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
naga.workspace = true

[[example]]
name = "bench_assets"
required-features = ["io"]

[[example]]
name = "bench_ir"
required-features = ["io"]

[[example]]
name = "diag_target"
required-features = ["io"]

[[example]]
name = "bench_uv"
required-features = ["io"]

[[example]]
name = "bench_remesh"
required-features = ["io"]

[[example]]
name = "bench_hlod_tree"
required-features = ["io"]
