[package]
name = "farthing-poc-engine"
description = "Proof-of-concept wgpu engine: a RenderHost with its own material system, used to prove the farthing boundary end to end."
version = "0.15.0"
edition = "2021"
license = "MIT-0"
publish = false

# Deliberately its own workspace: it may only use farthing's public API.
[workspace]

[dependencies]
farthing = { path = "../crates/farthing" }
wgpu = "30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
anyhow = "1"
serde_json = "1"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2
