# Timing on a GitHub runner, started by hand: builds bench-compare at two refs and times the
# realtime reducer with the builds taking turns (scripts/bench-realtime.py). The table lands in
# the run's summary. Hosted runners are shared, so read differences under a few percent as noise.
name: Bench

on:
  workflow_dispatch:
    inputs:
      base:
        description: Ref to compare against
        default: main
      head:
        description: Ref to measure (defaults to the ref the run was started on)
        default: ""
      rounds:
        description: Rounds per asset
        default: "12"
      os:
        description: Runner
        default: ubuntu-26.04
      time_env:
        description: "Environment for the timed runs, such as 'RT_TARGET=20000'"
        default: ""
      run:
        description: "Run instead of timing: bench-compare arguments, once per environment in run_envs"
        default: ""
      run_envs:
        description: "Environments for run, separated by ' | ', such as 'LF_OPTS={} | LF_OPTS={\"gutter_use\":0.25}'"
        default: ""
      perf:
        description: "Profile instead of timing: bench-compare arguments, such as 'realtime assets/CarConcept.glb'"
        default: ""
      perf_env:
        description: "Environment for the profiled run, such as 'RT_TARGET=20000 RAYON_NUM_THREADS=1'"
        default: "RT_RUNS=40"
      fast:
        description: "Time fast mode instead: triangle target, such as 10000 (base and head take turns)"
        default: ""
      best:
        description: "Time the default reducer (best) instead: triangle target, such as 10000 (base and head take turns)"
        default: ""
      features:
        description: "bench-compare Cargo features for every build, such as 'system-alloc'"
        default: ""

permissions:
  contents: read

jobs:
  realtime:
    if: inputs.perf == '' && inputs.run == '' && inputs.fast == '' && inputs.best == ''
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head || github.ref }}
          path: head
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.base }}
          path: base
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        id: assets
        with:
          path: assets
          key: bench-assets-8f492390
      - name: Fetch assets
        if: steps.assets.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p assets
          for n in ChronographWatch CarConcept DragonAttenuation; do
            curl -fsSL -o assets/$n.glb \
              https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/8f492390ddc7a2ae221a1369ef560589cf8c70fb/Models/$n/glTF-Binary/$n.glb
          done
      - name: Build
        shell: bash
        env:
          FEATURES: ${{ inputs.features }}
        run: |
          (cd base/bench-compare && cargo build --release --locked ${FEATURES:+--features "$FEATURES"})
          (cd head/bench-compare && cargo build --release --locked ${FEATURES:+--features "$FEATURES"})
      - name: Machine
        shell: bash
        run: |
          { echo '```'; (lscpu 2>/dev/null | grep -E 'Model name|^CPU\(s\)|Thread|Core' || powershell -c "(Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,NumberOfLogicalProcessors | Format-List | Out-String).Trim()" || echo unknown); echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "base $(git -C base rev-parse --short HEAD), head $(git -C head rev-parse --short HEAD), features: ${{ inputs.features || 'default' }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Time
        shell: bash
        run: |
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=.exe
          py=python3; [ "$RUNNER_OS" = Windows ] && py=python
          env ${{ inputs.time_env }} $py head/scripts/bench-realtime.py assets "${{ inputs.rounds }}" \
            base=base/bench-compare/target/release/bench-compare$ext \
            head=head/bench-compare/target/release/bench-compare$ext | tee -a "$GITHUB_STEP_SUMMARY"

  # Sampling profile of one bench-compare run (Linux only): hottest functions and source lines.
  profile:
    if: inputs.perf != ''
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        id: assets
        with:
          path: assets
          key: bench-assets-8f492390
      - name: Fetch assets
        if: steps.assets.outputs.cache-hit != 'true'
        run: |
          mkdir -p assets
          for n in ChronographWatch CarConcept DragonAttenuation; do
            curl -fsSL -o assets/$n.glb               https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/8f492390ddc7a2ae221a1369ef560589cf8c70fb/Models/$n/glTF-Binary/$n.glb
          done
      - name: Build
        run: cd bench-compare && cargo build --release --locked
        env:
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
          RUSTFLAGS: -C force-frame-pointers=yes
      - name: Profile
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq linux-tools-common linux-tools-generic "linux-tools-$(uname -r)" || true
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          PERF=$(command -v perf || ls /usr/lib/linux-tools/*/perf | head -1)
          env RD_METHODS="farthing realtime" ${{ inputs.perf_env }}             $PERF record -e cpu-clock -F 5000 -g -o perf.data --             bench-compare/target/release/bench-compare ${{ inputs.perf }} > /dev/null
          {
            echo '```'
            $PERF report -i perf.data --stdio --no-children --sort symbol -g none 2>/dev/null | grep -v '^#' | grep -v '^$' | head -60
            echo '--- inclusive (with callees)'
            $PERF report -i perf.data --stdio --children --sort symbol -g none 2>/dev/null | grep -v '^#' | grep -v '^$'               | grep -v '(inlined)' | awk '/farthing::/ || !/rayon(_core)?::|std::|core::/' | head -80
            echo '--- by source line'
            $PERF report -i perf.data --stdio --no-children --sort srcline -g none 2>/dev/null | grep -v '^#' | grep -v '^$' | head -120
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # One bench-compare command under several environments on a quiet machine, output as is.
  run:
    if: inputs.run != ''
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        id: assets
        with:
          path: assets
          key: bench-assets-8f492390
      - name: Fetch assets
        if: steps.assets.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p assets
          for n in ChronographWatch CarConcept DragonAttenuation; do
            curl -fsSL -o assets/$n.glb               https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/8f492390ddc7a2ae221a1369ef560589cf8c70fb/Models/$n/glTF-Binary/$n.glb
          done
      - name: Build
        shell: bash
        env:
          FEATURES: ${{ inputs.features }}
        run: cd bench-compare && cargo build --release --locked ${FEATURES:+--features "$FEATURES"}
      - name: Run
        shell: bash
        env:
          RUN_ENVS: ${{ inputs.run_envs }}
          RUN_ARGS: ${{ inputs.run }}
        run: |
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=.exe
          echo "$RUN_ENVS" | tr '|' '\n' | while IFS= read -r e; do
            e=$(echo "$e" | sed 's/^ *//; s/ *$//')
            echo "=== ${e:-(no environment)}"
            env $e bench-compare/target/release/bench-compare$ext $RUN_ARGS 2>&1 | grep -v '^  '
          done | tee -a "$GITHUB_STEP_SUMMARY"


  # Fast mode (or default reducer) A/B: base and head take turns reducing each asset (flattened)
  # to the target; minimum per asset over all rounds of RT_RUNS calls.
  fast:
    if: inputs.fast != '' || inputs.best != ''
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head || github.ref }}
          path: head
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.base }}
          path: base
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        id: assets
        with:
          path: assets
          key: bench-assets-8f492390
      - name: Fetch assets
        if: steps.assets.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p assets
          for n in ChronographWatch CarConcept DragonAttenuation; do
            curl -fsSL -o assets/$n.glb               https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/8f492390ddc7a2ae221a1369ef560589cf8c70fb/Models/$n/glTF-Binary/$n.glb
          done
      - name: Build
        shell: bash
        env:
          FEATURES: ${{ inputs.features }}
        run: |
          (cd base/bench-compare && cargo build --release --locked ${FEATURES:+--features "$FEATURES"})
          (cd head/bench-compare && cargo build --release --locked ${FEATURES:+--features "$FEATURES"})
      - name: Time
        shell: bash
        env:
          ROUNDS: ${{ inputs.rounds }}
          TARGET: ${{ inputs.fast || inputs.best }}
          METHOD: ${{ inputs.fast != '' && 'farthing fast' || 'farthing' }}
        run: |
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=.exe
          py=python3; [ "$RUNNER_OS" = Windows ] && py=python
          echo "$METHOD to $TARGET: base $(git -C base rev-parse --short HEAD), head $(git -C head rev-parse --short HEAD), $(nproc 2>/dev/null) cores" >> "$GITHUB_STEP_SUMMARY"
          $py - "$ext" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import os, subprocess, sys
          ext = sys.argv[1]
          builds = {b: f"{b}/bench-compare/target/release/bench-compare{ext}" for b in ("base", "head")}
          assets = ["ChronographWatch", "CarConcept", "DragonAttenuation"]
          method = os.environ["METHOD"].split()
          env = dict(os.environ, RD_METHODS="_".join(method), RT_TARGET=os.environ["TARGET"], RT_RUNS="5")
          best = {(b, a): 1e18 for b in builds for a in assets}
          for r in range(int(os.environ["ROUNDS"])):
              for b, exe in builds.items():
                  out = subprocess.run([exe, "realtime"] + [f"assets/{a}.glb" for a in assets],
                                       env=env, capture_output=True, text=True).stdout
                  for line in out.splitlines():
                      f = line.split()
                      if len(f) > 3 and f[0] in assets and f[2:2 + len(method)] == method:
                          best[(b, f[0])] = min(best[(b, f[0])], float(f[-2]))
          print("| asset | base ms | head ms | head/base |")
          print("|---|---|---|---|")
          for a in assets + ["sum"]:
              v = [sum(best[(b, x)] for x in assets) if a == "sum" else best[(b, a)] for b in builds]
              print(f"| {a} | {v[0]:.1f} | {v[1]:.1f} | {v[1] / v[0]:.3f} |")
          PY
